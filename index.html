<style>
@font-face{font-family:"DotGothic16";src:url("fonts/dotgothic16.woff2") format("woff2");font-display:swap}
/* layout: one screen — header, business tabs, status row with Sumi, filters, scrolling quest log; sheets slide up over it */
:root{--bg:#251B23;--fg:#F2E4EA;--mut:#9B8795;--acc:#E79AB6;--ln:#41303D;--gold:#E0B860;--px:'DotGothic16',ui-monospace,monospace;--g:max(18px,env(safe-area-inset-left,0px));--gr:max(18px,env(safe-area-inset-right,0px));color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--px);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px dashed var(--acc);outline-offset:3px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;padding-top:calc(env(safe-area-inset-top,0px) + 10px);user-select:none;-webkit-user-select:none}
.dt{font-size:11px;letter-spacing:2px;color:var(--mut)}
.hd{display:flex;align-items:center;gap:10px;padding:14px var(--gr) 0 var(--g)}
.logo{flex:1;font-size:22px;letter-spacing:1px}.logo b{font-weight:400;color:var(--acc)}
.pb{width:44px;height:44px;margin:-6px -6px -6px 0;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .12s steps(2)}
.pb:active{transform:scale(.88)}
.bt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--fg)}
.pb span{display:block;transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}.pb.o span{transform:rotate(90deg) scale(.8)}
.tabs{display:flex;gap:18px;padding:16px var(--gr) 0 var(--g);overflow-x:auto;scrollbar-width:none}
.tab{font-size:12px;letter-spacing:1px;color:var(--mut);padding-bottom:5px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--acc)}
.panel{display:flex;gap:14px;align-items:flex-start;padding:8px var(--gr) 10px var(--g);border-bottom:1px dashed var(--ln);min-height:100px}
#cat{width:63px;height:84px;image-rendering:pixelated;flex:none;cursor:pointer}
.pinfo{flex:1;min-width:0;padding-top:16px}
.lvrow{display:flex;justify-content:space-between;letter-spacing:1px}
.bar{position:relative;height:8px;border:1.5px solid var(--fg);margin-top:4px;overflow:hidden}
.bar div{position:absolute;top:1px;bottom:1px;left:1px;background:repeating-linear-gradient(90deg,var(--acc) 0 5px,transparent 5px 7px);transition:width .8s steps(8)}
.stat{display:block;font-size:14px;letter-spacing:1px;margin-top:10px;line-height:1.4;text-align:left}
.stat .dt{font-size:10px;letter-spacing:1px}
.chips{display:flex;gap:16px;padding:10px var(--gr) 4px var(--g);overflow-x:auto;scrollbar-width:none}
.ch{font-size:11px;letter-spacing:1px;color:var(--mut);white-space:nowrap}
.ch.on{color:var(--fg)}.ch.on::before{content:'▸ ';color:var(--acc)}
.list{flex:1;overflow-y:auto;padding:0 var(--gr) calc(80px + env(safe-area-inset-bottom,0px)) var(--g);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar,.sh::-webkit-scrollbar,.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.q{border-bottom:1px dashed var(--ln);padding:12px 0;transition:transform .5s cubic-bezier(.5,0,.8,.4),opacity .4s,max-height .4s .35s,padding .4s .35s;max-height:600px;overflow:hidden}
.q.gone{transform:translateY(-30px);opacity:0;max-height:0;padding:0}
.qr{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.bx{flex:none;width:20px;height:20px;border:2px solid var(--fg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bg)}
.bx.on{background:var(--gold);border-color:var(--gold)}
.gem{display:inline-block;width:6px;height:6px;margin-right:8px;vertical-align:2px}
.tt{font-size:14px;letter-spacing:1px;line-height:1.5;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:10px;letter-spacing:1px;color:var(--mut)}
.meta .due{color:var(--acc)}.meta .late{color:#F08A8A}
.sub{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.2,.9,.3,1);padding-left:32px}
.q.open .sub{max-height:500px}
.sr{display:flex;gap:10px;align-items:center;padding:8px 0 0;font-size:12px;letter-spacing:1px;width:100%;text-align:left}
.sr .bx{width:14px;height:14px;font-size:8px;border-width:1.5px}
.sr.d span{text-decoration:line-through;color:var(--mut)}
.qa{display:flex;gap:18px;padding:10px 0 2px}.qa button{font-size:11px;letter-spacing:2px;color:var(--mut)}.qa button:last-child{color:var(--acc)}
.empty{text-align:center;padding:56px 0;line-height:1.9}
.box{border:2px solid var(--fg);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg);background:var(--bg)}
.ts{position:absolute;left:var(--g);right:var(--gr);bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:12px 14px;font-size:12px;letter-spacing:1px;display:flex;justify-content:space-between;gap:10px;transform:translateY(14px);opacity:0;transition:all .3s steps(3);pointer-events:none;z-index:30}
.ts.o{transform:none;opacity:1;pointer-events:auto}
#un{color:var(--acc);font-size:12px;letter-spacing:2px}
.sp{position:absolute;width:4px;height:4px;background:var(--gold);pointer-events:none;z-index:40}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;scrollbar-width:none;z-index:21;border-top:2px solid var(--fg);background:var(--bg);padding:14px var(--gr) calc(28px + env(safe-area-inset-bottom,0px)) var(--g);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,1.1,.3,1)}
.bd.o{opacity:1;pointer-events:auto}.sh.o{transform:none}
.grip{width:44px;height:4px;background:var(--fg);margin:0 auto 14px;background-clip:content-box;padding:8px 10px;box-sizing:content-box;margin-top:-8px}
.st{font-size:17px;letter-spacing:1px;margin-bottom:6px}
.in{display:block;width:100%;font-family:var(--px);font-size:16px;letter-spacing:1px;background:transparent;border:0;border-bottom:1px dashed var(--ln);border-radius:0;color:var(--fg);outline:none;padding:6px 0 8px;-webkit-appearance:none;appearance:none;user-select:text;-webkit-user-select:text}
.in::placeholder{color:var(--mut);opacity:.7}.in:focus{border-bottom-color:var(--acc)}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--ln);font-size:13px;letter-spacing:1px;width:100%;gap:10px}
.mrow .k{color:var(--mut);font-size:11px;letter-spacing:2px}
.mrow .v{display:flex;align-items:center;gap:8px;text-align:right}
.mrow .v::before{content:'◀';font-size:8px;color:var(--ln)}.mrow .v::after{content:'▶';font-size:8px;color:var(--acc)}
.mrow .in{width:130px;text-align:right;padding:0;border-bottom:0;font-size:14px}
.step{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;padding:6px 0}
.step button{color:var(--mut);padding:0 6px;font-size:14px}
.er{color:var(--acc);min-height:16px;margin-top:10px}
.bt{display:inline-flex;padding:10px 18px;border:2px solid var(--fg);box-shadow:3px 3px 0 var(--fg);font-size:12px;letter-spacing:2px;background:var(--fg);color:var(--bg)}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:12px}
.seg{display:flex;gap:20px;margin-bottom:10px}.seg button{font-size:15px;letter-spacing:1px;color:var(--mut);padding-bottom:4px;border-bottom:2px solid transparent}.seg button.on{color:var(--fg);border-color:var(--acc)}
.calh{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:1px;padding:4px 0 8px}
.calh button{color:var(--acc);padding:0 10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg .w{font-size:9px;color:var(--mut);letter-spacing:1px;padding-bottom:4px}
.cg .d{font-size:12px;padding:6px 0 3px;border:1.5px solid transparent;min-height:34px}
.cg .d.t{border-color:var(--ln)}.cg .d.s{border-color:var(--fg);background:rgba(255,255,255,.06)}.cg .d.x{color:var(--ln)}
.dots{display:flex;gap:2px;justify-content:center;margin-top:3px;height:4px}.dots i{width:4px;height:4px;display:block}
.goal{padding:12px 0;border-bottom:1px dashed var(--ln)}
.gh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:1px;gap:10px}
.gn{text-align:left}.gn::after{content:' ✎';font-size:10px;color:var(--mut)}
.gb{display:flex;gap:2px;margin-top:7px;padding:2px;border:2px solid var(--fg)}
.gb i{flex:1;height:10px;display:block;background:rgba(255,255,255,.06)}
.gc{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px}
.gbtn{display:inline-flex;gap:8px}.gbtn button{min-width:30px;height:26px;border:1.5px solid var(--fg);display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 8px}
.addg{display:block;width:100%;text-align:center;margin-top:16px;padding:12px 0;border:1.5px dashed var(--ln);font-size:12px;letter-spacing:2px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{border:2px solid var(--ln);padding:6px 0 4px;text-align:center;font-size:9px;letter-spacing:1px;line-height:1.3}
.tile canvas{width:36px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 3px}
.tile.sel{border-color:var(--fg)}.tile.lock{opacity:.4}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-10px)}55%{transform:none}70%{transform:translateY(-3px)}}
.hop{animation:hop .7s steps(6)}
.spl{position:absolute;inset:0;z-index:50;background:var(--bg);cursor:pointer}
.spl .gm{position:absolute;left:50%;top:calc(34% + 20px);width:100px;height:100px;margin-left:-50px;animation:bob 1.6s steps(5) infinite alternate}
.spl .gsh{position:absolute;left:50%;top:calc(34% + 130px);width:60px;height:6px;margin-left:-30px;background:#170F15;animation:shd 1.6s steps(5) infinite alternate}
@keyframes bob{to{transform:translateY(-16px)}}@keyframes shd{to{transform:scaleX(.6);opacity:.55}}
.spl .dt{position:absolute;left:0;right:0;text-align:center;transition:opacity .3s}
.bl{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.syd[hidden]{display:none}.syd{display:inline-block;width:6px;height:6px;margin-left:8px;vertical-align:middle;background:var(--ln)}.syd.ok{background:#9DBF8A}.syd.busy{background:var(--gold);animation:bl .8s steps(1) infinite}.syd.err{background:var(--acc)}
.logo{cursor:pointer}
@media (prefers-reduced-motion:reduce){.hop,.bl,.syd.busy,.spl .gm,.spl .gsh{animation:none}}
</style>
</head>

  <div class="spl" id="spl" role="button" aria-label="Tap to begin"><div class="gsh"></div><svg class="gm" viewBox="3 3 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="#E79AB6" d="M7 3h2v1H7z M6 4h4v1H6z M5 5h6v1H5z M4 6h8v1H4z M3 7h10v2H3z M4 9h8v1H4z M5 10h6v1H5z M6 11h4v1H6z M7 12h2v1H7z"/><path fill="#F8D3E0" d="M7 3h1v1H7z M6 4h1v1H6z M5 5h1v1H5z M4 6h1v1H4z M6 6h1v1H6z"/><path fill="#B86F8B" d="M8 12h1v1H8z M9 11h1v1H9z M10 10h1v1h-1z M11 9h1v1h-1z M12 8h1v1h-1z"/></svg>
    <div class="dt" style="top:calc(34% + 156px);font-size:22px;letter-spacing:1px;color:var(--fg)">quest<span style="color:var(--acc)">.</span>exe</div>

  <div class="hd"><div class="logo" id="logo" role="button" aria-label="Sync">quest<b>.</b>exe<i class="syd" id="syd" hidden></i></div><button class="pb" id="cb" aria-label="This month"><span><svg viewBox="0 0 12 12" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path fill="#F2E4EA" d="M3 1h1v2H3z M8 1h1v2H8z M1 2h10v2H1z M1 4h1v7H1z M10 4h1v7h-1z M2 10h8v1H2z M3 5h1v1H3z M5 5h1v1H5z M7 5h1v1H7z M3 7h1v1H3z M5 7h1v1H5z"/><path fill="#E79AB6" d="M7 7h2v2H7z"/></svg></span></button><button class="pb" id="pb" aria-label="New quest"><span><svg viewBox="3 3 10 10" width="30" height="30" shape-rendering="crispEdges" aria-hidden="true"><path fill="#E79AB6" d="M7 3h2v1H7z M6 4h4v1H6z M5 5h6v1H5z M4 6h8v1H4z M3 7h10v2H3z M4 9h8v1H4z M5 10h6v1H5z M6 11h4v1H6z M7 12h2v1H7z"/><path fill="#F8D3E0" d="M7 3h1v1H7z M6 4h1v1H6z M5 5h1v1H5z M4 6h1v1H4z M6 6h1v1H6z"/><path fill="#B86F8B" d="M8 12h1v1H8z M9 11h1v1H9z M10 10h1v1h-1z M11 9h1v1h-1z M12 8h1v1h-1z"/></svg></span></button></div>

<script>
(()=>{
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Sumi ---------- */
const CAT=["...k......k.....","..kpk....kpk....","..kkkkkkkkkk....","..kkekkkkekk....","..kkekkkkekk....","..kkkknnkkkk....","...kkkkkkkk.....","....kkkkkk......","....kkkkkk......","...kkkkkkkk.....","...kkkkkkkk.....","...kkkkkkkk.....","..kkkkkkkkkk....","..kk.kkkk.kkkkk."];
const A={
bow:{lv:1,n:'bow',r:{9:"...........pp.pp..",10:"...........ppdpp..",11:"...........pp.pp.."}},
party:{lv:2,n:'party hat',r:{1:".......gg.........",2:".......pp.........",3:"......llll........",4:"......pppp........",5:".....llllll.......",6:".....pppppp.......",7:"....llllllll......",8:"....pppppppp......",9:"...wwwwwwwwww....."}},
fish:{lv:3,n:'fish snack',r:{14:"b......bbbbb......",15:"bb...bbbbbbbbb....",16:".bbbbbbbbbbbcbb...",17:"bb...BBBBBBBBB....",18:"b......BBBBB......"}},
shades:{lv:4,n:'cat-eye shades',r:{10:"..f..........f....",11:"..fffff..fffff....",12:"...fwLffffwLf.....",13:"...fLLf..fLLf.....",14:"....ff....ff......"}},
scarf:{lv:5,n:'cosy scarf',r:{15:"....dddddddd......",16:"....dpdpdpdp......",17:".........dd.......",18:".........dp......."}},
alien:{lv:6,n:'antennae',r:{3:"....aa....aa......",4:"....aa....aa......",5:".....x....x.......",6:".....x....x.......",7:"......x..x........",8:"......x..x........",9:"......x..x........"}},
flowers:{lv:7,n:'flower crown',r:{8:"...p..g..l..p.....",9:"...ssssssssss....."}},
daruma:{lv:8,n:'daruma',r:{3:"......rrrr........",4:".....rrrrrr.......",5:".....rwwwwr.......",6:".....rcwwcr.......",7:".....rwwwwr.......",8:".....rrggrr.......",9:"......rrrr........"}},
witch:{lv:9,n:'witch hat',r:{0:"...........v.g....",1:"..........vvggg...",2:".........vv..g....",3:"........vvv.......",4:".......vVvv.......",5:"......vvVvv.......",6:"......vvvmmv......",7:"....vvvvvvvvv.....",8:"....ppppggpppp....",9:".vvvvvvvvvvvvvvv.."}},
crown:{lv:10,n:'crown',r:{7:".....g.gg.g.......",8:".....gggggg.......",9:".....gpggpg......."}}};
const CC={k:'#141015',e:'#8FC46A',n:'#3E353C',p:'#3E353C',o:'#6A5765'};
const HC={p:'#E8A3B4',d:'#B65A7A',g:'#E0B860',s:'#8FA27E',l:'#AA8EC6',w:'#F4EEE4',v:'#5E4680',V:'#8A6CB4',m:'#C9A7E6',b:'#7FA9C2',B:'#CFE3EE',c:'#1E1B1C',x:'#A99AA4',a:'#B6D96B',r:'#C4504F',f:'#E8A3B4',L:'#7A3A5E'};
function draw(cv,acc){const x=cv.getContext('2d'),w=16,h=CAT.length;x.clearRect(0,0,18,24);const at=(cx,cy)=>cy>=0&&cy<h&&cx>=0&&cx<w?(CAT[cy][cx]||'.'):'.';
  for(let y=-1;y<=h;y++)for(let X=-1;X<=w;X++){if(at(X,y)!=='.')continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>at(X+dx,y+dy)!=='.')){x.fillStyle=CC.o;x.fillRect(X+1,y+8,1,1)}}
  CAT.forEach((r,y)=>[...r].forEach((c,X)=>{if(c==='.')return;x.fillStyle=CC[c];x.fillRect(X+1,y+8,1,1)}));
  if(acc&&A[acc])Object.entries(A[acc].r).forEach(([y,r])=>[...r].forEach((c,X)=>{if(c==='.')return;x.fillStyle=HC[c];x.fillRect(X,+y,1,1)}))}

/* ---------- sound (unchanged from the approved set) ---------- */
let AC,M;
function ac(){if(AC)return AC;AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=1.9;const cp=AC.createDynamicsCompressor();cp.threshold.value=-14;cp.knee.value=12;cp.ratio.value=4;cp.attack.value=.003;cp.release.value=.2;cp.connect(AC.destination);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;const dl=AC.createDelay();dl.delayTime.value=.18;const fb=AC.createGain();fb.gain.value=.22;M.connect(lp);lp.connect(cp);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(cp);return AC}
const r6=f=>f*(1+(Math.random()-.5)*.06);
function tone(f,t0,du,ty,v,atk,to){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+du*.7);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(g).connect(M);o.start(t);o.stop(t+du+.05)}
const pluck=(f,t0,v,du)=>{tone(f,t0,du,'sine',v,.004);tone(f*3,t0,.15,'triangle',v*.12,.003)};
const chime=(f,t0,v,du)=>tone(f,t0,du,'sine',v,.006);
const pop=(t0,v)=>tone(r6(380),t0,.09,'sine',v,.004,r6(760));
const SFX={intro:()=>{[523,659,784,1047,1319].forEach((f,i)=>pluck(f,i*.14,.035,1.1));pluck(1568,.85,.03,1.4)},
  pop:()=>pop(0,.06),open:()=>{pop(0,.04);chime(r6(1047),.05,.022,.7)},add:()=>{pop(0,.045);chime(r6(784),.06,.022,.7);chime(r6(1175),.15,.018,.9)},
  tap:()=>tone(r6(760),0,.05,'sine',.022,.002,r6(520)),undo:()=>{tone(r6(620),0,.1,'sine',.035,.006,r6(340));chime(r6(523),.07,.015,.5)},
  grant:()=>{const n=8;for(let i=0;i<n;i++){const p=i/(n-1);tone(r6(1100*Math.pow(2.7,p)),p*.5+Math.random()*.02,i===n-1?.45:.14,'sine',.003+.006*p,.004)}}};
const sfx=k=>{if(!st.snd)return;try{if(AC&&AC.state==='suspended')AC.resume();SFX[k]()}catch(e){}};

const dlabel=s=>{if(!s)return'';const n=Math.round((parse(s)-D0())/day);if(n<0)return'overdue';if(n===0)return'today';if(n===1)return'tomorrow';const d=parse(s);if(n<7)return d.toLocaleDateString('en-GB',{weekday:'short'}).toLowerCase();return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toLowerCase()};
function nextDue(q){const base=q.due?parse(q.due):D0();const today=D0();let d=new Date(base);do{if(q.rep==='daily')d.setDate(d.getDate()+1);else if(q.rep==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1)}while(d<=today);return iso(d)}

function render(anim){const c=st.cur,L=$('list'),td=iso(D0());L.innerHTML='';
  st.quests.filter(q=>q.b===c&&(filt==='all'||(filt==='today'?(q.due&&q.due<=td):q.tag===filt))).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:({hi:0,md:1,lo:2}[a.p]-{hi:0,md:1,lo:2}[b.p])).forEach(q=>qrow(q,L));

function sparks(el,n){const r=el.getBoundingClientRect(),o=app.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement('span');s.className='sp';s.style.left=(r.left-o.left+r.width/2)+'px';s.style.top=(r.top-o.top+r.height/2)+'px';app.appendChild(s);s.animate([{transform:'none',opacity:1},{transform:`translate(${(Math.random()-.5)*110}px,${-60-Math.random()*120}px)`,opacity:0}],{duration:900+Math.random()*400,easing:'steps(8)',fill:'forwards'});setTimeout(()=>s.remove(),1400)}}

function calendar(el,month,sel,onPick,marks){const m=new Date(month.getFullYear(),month.getMonth(),1),start=(m.getDay()+6)%7,days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),t0=D0();

  for(let i=0;i<start;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){const s=iso(new Date(m.getFullYear(),m.getMonth(),d)),mk=marks?marks(s):[];h+=`<button class="d${s===iso(t0)?' t':''}${s===sel?' s':''}${parse(s)<t0?' x':''}" data-d="${s}">${d}<div class="dots">${mk.slice(0,3).map(c=>`<i style="background:${c}"></i>`).join('')}</div></button>`}
  el.innerHTML=h+'</div>';el.querySelectorAll('[data-n]').forEach(b=>b.onclick=e=>{e.stopPropagation();sfx('tap');calendar(el,new Date(m.getFullYear(),m.getMonth()+ +b.dataset.n,1),sel,onPick,marks)});
  el.querySelectorAll('[data-d]').forEach(c=>c.onclick=e=>{e.stopPropagation();sfx('tap');onPick(c.dataset.d);calendar(el,m,c.dataset.d,onPick,marks)})}

    if(b.dataset.a==='amt'){const row=b.closest('.gc');row.innerHTML=`<input class="in" id="ga" inputmode="decimal" placeholder="amount in €" style="font-size:14px">`;const i=$('ga');i.focus();const ok=()=>{const n=parseFloat(i.value.replace(',','.'));if(isFinite(n)&&n){g.v=Math.max(0,Math.round((g.v+n)*100)/100);sfx('tap')}save();after(g,was)};i.onblur=ok;i.onkeydown=e=>{if(e.key==='Enter')i.blur()};return}

function goalForm(g){const Mb=$('mbody'),isNew=!g,keys=Object.keys(B);let bi=keys.indexOf(isNew?st.cur:g.b);const units=[['count','count'],['euro','€ amount'],['sales','studyo iki sales']];let ui=isNew?0:Math.max(0,units.findIndex(u=>u[0]===g.u));
  const okU=()=>units.filter(u=>u[0]!=='sales'||keys[bi]==='si');

  $('gb_').onclick=()=>{sfx('tap');bi=(bi+1)%keys.length;paint()};$('gu_').onclick=()=>{sfx('tap');const ou=okU(),j=ou.indexOf(units[ui]);ui=units.indexOf(ou[(j+1)%ou.length]);paint()};
  $('gback').onclick=()=>{sfx('tap');goals()};['gname','gt'].forEach(i=>$(i).oninput=()=>$('gerr').textContent='');
  $('gsave').onclick=()=>{const n=$('gname').value.trim(),t=parseFloat($('gt').value.replace(',','.'));if(!n){$('gerr').textContent='give your goal a name';return}if(!isFinite(t)||t<=0){$('gerr').textContent='set a monthly target above 0';return}
    if(isNew)st.goals.push({id:uid(),b:keys[bi],n,t,v:0,u:units[ui][0]});else Object.assign(g,{b:keys[bi],n,t,u:units[ui][0]});save();sfx('add');goals();toast(isNew?'✦ new goal set':'✦ goal saved')};
  if(!isNew){let armed=false;$('gdel').onclick=()=>{if(!armed){armed=true;sfx('tap');$('gdel').textContent='tap again to delete';setTimeout(()=>{armed=false;const d=$('gdel');if(d)d.textContent='delete goal'},3000);return}
    const i=st.goals.indexOf(g);st.goals.splice(i,1);save();sfx('undo');goals();toast(`${g.n} goal deleted`,()=>{st.goals.splice(i,0,g);save();if($('mbody'))goals()})}}}

function closet(){sfx('pop');openSh(`<div class="row2" style="margin-top:0"><span class="st" style="margin:0">sumi's closet</span><span><button class="dt" id="syb" style="margin-right:14px">sync · ${me?'on':'off'}</button><button class="dt" id="snd">sound · ${st.snd?'on':'off'}</button></span></div><div class="dt">new pieces unlock as you level up</div><div class="grid" id="grid"></div>`);

/* ---------- sync: supabase, shared by kayla + elliot ---------- */
const SB_URL='https://uwwktosnhogpvlbaetdr.supabase.co',SB_KEY='sb_publishable_J7mv9DtkYYC60bd5PFh8Vw_XzTXUY7z',SK='questexe.sync';
let sy={last:{},cur:null};try{Object.assign(sy,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
const sySave=()=>{try{localStorage.setItem(SK,JSON.stringify(sy))}catch(e){}};
const metaOf=()=>({lv:st.lv,xp:st.xp,wear:st.wear,stats:st.stats,month:st.month});
function records(){const m=new Map();st.quests.forEach(q=>m.set(q.id,{kind:'quest',data:q}));st.goals.forEach(g=>m.set(g.id,{kind:'goal',data:g}));m.set('meta',{kind:'meta',data:metaOf()});return m}
function applyRow(id,kind,d){if(kind==='meta'){st.lv=d.lv||1;st.xp=d.xp||0;st.wear=d.wear??null;st.stats=Object.assign({ch:0,si:0,ca:0},d.stats);if(d.month)st.month=d.month;return}
  const arr=kind==='quest'?st.quests:st.goals,o=arr.find(x=>x.id===id);if(o){for(const k in o)delete o[k];Object.assign(o,d)}else arr.push(d)}
function removeId(id){for(const arr of [st.quests,st.goals]){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)}}
async function push(){const recs=records(),rows=[];
  for(const [id,r] of recs){const j=JSON.stringify(r.data);if(sy.last[id]!==j)rows.push({id,kind:r.kind,data:JSON.parse(j),deleted:false,j})}
  for(const id in sy.last)if(!recs.has(id))rows.push({id,kind:'gone',data:null,deleted:true,j:null});
  if(!rows.length)return;
  const {error}=await sb.from('docs').upsert(rows.map(({j,...r})=>r));if(error)throw error;
  rows.forEach(r=>{if(r.deleted)delete sy.last[r.id];else sy.last[r.id]=r.j});sySave()}
async function pull(){const first=!sy.cur;let q=sb.from('docs').select('id,kind,data,deleted,updated_at').order('updated_at').limit(5000);
  if(!first)q=q.gt('updated_at',new Date(Date.parse(sy.cur.slice(0,19)+'Z')-5000).toISOString());
  const {data,error}=await q;if(error)throw error;let changed=false;const recs=records(),remoteGoals=[];
  for(const row of data){const id=row.id,local=recs.get(id),lj=local?JSON.stringify(local.data):undefined,rj=JSON.stringify(row.data);
    if(!sy.cur||row.updated_at>sy.cur)sy.cur=row.updated_at;
    if(row.deleted){if(first){delete sy.last[id];continue}const dirty=local?sy.last[id]!==lj:false;if(local&&!dirty){removeId(id);changed=true}delete sy.last[id];continue}
    if(row.kind==='goal')remoteGoals.push(row.data);
    if(first){if(id==='meta'&&local){const a=metaOf(),b=row.data,rb=(b.lv||1)*100+(b.xp||0),ra=a.lv*100+a.xp;applyRow(id,'meta',{...b,lv:rb>=ra?b.lv:a.lv,xp:rb>=ra?b.xp:a.xp,wear:b.wear??a.wear,stats:{...a.stats,...b.stats},month:b.month>a.month?b.month:a.month});changed=true;continue}
      if(lj!==rj){applyRow(id,row.kind,row.data);changed=true}sy.last[id]=rj;continue}
    const dirty=local?sy.last[id]!==lj:(id in sy.last);if(dirty)continue;
    if(lj!==rj){applyRow(id,row.kind,row.data);changed=true}sy.last[id]=rj}
  if(first){const ids=new Set(remoteGoals.map(g=>g.id));st.goals=st.goals.filter(g=>{if(ids.has(g.id))return true;const twin=st.goals.find(r=>ids.has(r.id)&&r.b===g.b&&r.n===g.n&&r.u===g.u);if(twin){twin.v=Math.max(twin.v||0,g.v||0);changed=true;return false}return true});if(!sy.cur)sy.cur=new Date(0).toISOString()}
  sySave();return changed}
function syncSoon(ms=700){if(!me)return;clearTimeout(syT);syT=setTimeout(syncNow,ms)}
async function syncNow(){if(!me||!sb)return;if(syBusy){syAgain=true;return}syBusy=true;setSy('busy');
  try{if(sy.cur)await push();const ch=await pull();if(ch){monthTick();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}render()}await push();setSy('ok')}
  catch(e){const denied=e&&(e.code==='42501'||e.status===401||e.status===403||/row-level security/i.test(e.message||''));setSy(denied?'denied':'err',denied?'this email isn’t on the members list':'offline · will retry')}
  finally{syBusy=false;if(syAgain){syAgain=false;syncSoon(300)}}}
function setSy(s,m=''){syState=s;syMsg=m;const d=$('syd');d.hidden=!me;d.className='syd '+(s==='ok'?'ok':s==='busy'?'busy':s==='off'?'':'err');const el=$('syst');if(el)el.textContent=syLabel()}

function startLive(){if(live||!sb)return;live=sb.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},()=>syncSoon(300)).subscribe()}

function syncSheet(){sfx('pop');if(!sbInit()){openSh(`<div class="st">sync</div><div class="dt">sync couldn’t load · check your connection</div>`);return}

    b.disabled=true;const lbl=b.textContent;b.textContent='one sec…';
